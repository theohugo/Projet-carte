{% extends "base.html" %}
{% block title %}Créer un compte — Poké-Uno{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Créer un compte</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Créer mon compte</button>
    </form>
    <p><a href="{% url 'login' %}">Déjà un compte ? Se connecter</a></p>
</div>
{% endblock %}
