services:
  web:
    build: .
    container_name: poketable
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    # `default` reste explicite : dès qu'un service déclare ses réseaux, Compose
    # ne l'ajoute plus automatiquement, et web perdrait l'accès à db et cache.
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.poketable.rule=Host(`poketable.theoxeu.com`)"
      - "traefik.http.routers.poketable.entrypoints=websecure"
      - "traefik.http.routers.poketable.tls=true"
      - "traefik.http.routers.poketable.tls.certresolver=le"
      - "traefik.http.services.poketable.loadbalancer.server.port=8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Les doubles $ retardent l'expansion : PostgreSQL reçoit ses propres
      # variables d'environnement au lieu de celles du shell qui lance Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_data:
  media_data:
  redis_data:

networks:
  proxy:
    external: true
