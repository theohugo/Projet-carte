# Fusionné automatiquement par `docker compose` en plus de docker-compose.yml :
# confort de développement (rechargement à chaud, pas de build de statiques figée).
# La production passe par Traefik et ne charge jamais ce fichier : le pipeline de
# déploiement appelle Compose avec un `-f` explicite, ce qui désactive la fusion
# automatique de l'override.
services:
  web:
    # Publier le port n'a de sens qu'en local ; en production Traefik joint le
    # conteneur par le réseau `proxy`.
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - static_data:/app/staticfiles
      - media_data:/app/media
    environment:
      DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,host.docker.internal"
    command: uv run python manage.py runserver 0.0.0.0:8000
