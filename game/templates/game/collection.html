{% extends "base.html" %}

{% block title %}Collection — PokéTable{% endblock %}

{% block content %}
<section
    class="collection-page"
    aria-labelledby="collection-page-title"
>
    <header class="collection-header">
        <p class="section-kicker">
            Pokédex
        </p>

        <h1 id="collection-page-title">
            Collection
        </h1>

        <p>
            Les {{ cards|length }} premières espèces du Pokédex,
            génération 1. Termine des quêtes pour débloquer leur carte.
        </p>
    </header>

    <div
        class="collection-grid"
        role="list"
    >
        {% for card in cards %}
            <figure
                class="collection-card"
                role="listitem"
            >
                <div
                    class="collection-card-frame collection-card-locked"
                    aria-label="Carte non débloquée"
                >
                    <img
                        class="collection-card-locked-back"
                        src="https://i0.wp.com/blog.myplanner.fr/source/web-pixs/02-anniversaires/2-2-enfants/pokemon/Dos-carte-pokemon-icone.png?resize=222%2C310"
                        alt=""
                        loading="lazy"
                    >

                    <span class="collection-card-locked-label">
                        Verrouillé
                    </span>

                    <span class="collection-card-locked-number">
                        #{{ card.pokedex_id }}
                    </span>
                </div>

                <figcaption>
                    {{ card.name_fr }}
                </figcaption>
            </figure>
        {% endfor %}
    </div>
</section>
{% endblock %}
