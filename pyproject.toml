[project]
name = "poketable"
version = "0.2.0"
description = "Plateforme Django de jeux de société Pokémon multijoueurs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 110
exclude = ["**/migrations/"]

[tool.ruff.lint]
extend-ignore = [
    "RUF012",  # Django `class Meta` fields (ordering/constraints/...) are never mutated at runtime.
]

[tool.black]
line-length = 110
target-version = ["py313"]
extend-exclude = "/migrations/"
