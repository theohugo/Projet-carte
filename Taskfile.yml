version: '3'

vars:
  HOST: 127.0.0.1
  PORT: 8000
  URL: http://{{.HOST}}:{{.PORT}}/

tasks:
  default:
    desc: Liste des tâches disponibles
    cmds:
      - task --list

  check:
    desc: Vérification de configuration et système (Django check)
    cmds:
      - uv run python manage.py check

  lint:
    desc: Linter le code Python (ruff)
    cmds:
      - uvx ruff check .

  lint:fix:
    desc: Corriger automatiquement les erreurs de linting (ruff)
    cmds:
      - uvx ruff check . --fix

  format:
    desc: Vérifier le formatage du code (black)
    cmds:
      - uvx black --check .

  test:
    desc: Exécuter les tests unitaires Django
    cmds:
      - uv run python manage.py test

  seed:
    desc: Charger le catalogue de cartes Pokémon depuis le fixture committé
    cmds:
      - uv run python manage.py seed_pokemon_cards

  seed:refresh:
    desc: Régénérer le fixture de cartes Pokémon depuis PokeAPI (accès réseau requis)
    cmds:
      - uv run python manage.py seed_pokemon_cards --from-api

  tcg:refresh:
    desc: Régénérer les visuels de cartes TCG de la saison 1 (Set de Base, accès réseau requis)
    cmds:
      - uv run python manage.py fetch_tcg_card_images --saison 1

  tcg:refresh:151:
    desc: Régénérer le catalogue des impressions de la saison 2 (série 151, accès réseau requis)
    cmds:
      - uv run python manage.py fetch_card_prints --saison 2

  run:
    desc: Lancer le serveur de développement Django
    cmds:
      - uv run python manage.py runserver {{.HOST}}:{{.PORT}}

  preview:
    desc: Ouvrir l'application dans le navigateur par défaut
    cmds:
      - python3 -m webbrowser {{.URL}}

  docker:up:
    desc: Lancer la stack complète (web + PostgreSQL + Redis) avec Docker Compose
    cmds:
      - docker compose up --build

  docker:down:
    desc: Arrêter la stack Docker Compose
    cmds:
      - docker compose down

  clean:
    desc: Nettoyer les fichiers de cache (__pycache__, .pytest_cache, .ruff_cache, *.pyc)
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete
      - find . -type d -name ".pytest_cache" -exec rm -rf {} +
      - find . -type d -name ".ruff_cache" -exec rm -rf {} +
